# Production docker-compose — lives on the Hetzner server at /opt/agentsights/
#
# First-time setup on the server:
#   1. mkdir -p /opt/agentsights/model
#   2. rsync -avz backend/AI_modules/model/ root@YOUR_IP:/opt/agentsights/model/
#   3. Copy this file to /opt/agentsights/docker-compose.prod.yml
#   4. Create /opt/agentsights/.env with all real values (see backend/.env.example)
#      Make sure it includes: OLLAMA_API_URL=http://ollama:11434/api/generate
#   5. docker compose -f docker-compose.prod.yml up -d

services:
  # ─────────────────────────────────────────────
  # Django backend
  # ─────────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_USERNAME}/agentsights-backend:latest
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded audio files across deploys
      - media_files:/app/backend/api/media
      # Persist WhisperX / PyAnnote model cache (downloads once, kept forever)
      - hf_cache:/app/.cache/huggingface
      # Local fine-tuned FLAN-T5 model (uploaded once via rsync, never rebuilt)
      - ./model:/app/backend/AI_modules/model
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/users/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s      # Allow time for migrate + collectstatic + PyTorch load

  # ─────────────────────────────────────────────
  # Ollama — local LLM for coaching tips
  # Pulls the model on first start; subsequent starts skip download (cached volume)
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Pattern: start serve in background, wait for it to be ready, pull model, then keep alive.
    # Note: avoid $VAR syntax — docker-compose substitutes it before the shell sees it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 10 && ollama pull llama3.2; wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 15            # Up to 2.5 min for model pull on first boot
      start_period: 20s

volumes:
  media_files:
  hf_cache:
  ollama_data:
