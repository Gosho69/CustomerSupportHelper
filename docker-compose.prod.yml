# Production docker-compose — lives on the Hetzner server at /opt/agentsights/
#
# First-time setup on the server:
#   1. mkdir -p /opt/agentsights/model
#   2. rsync -avz backend/AI_modules/model/ root@YOUR_IP:/opt/agentsights/model/
#   3. Create /opt/agentsights/.env with all real values (see backend/.env.example)
#      Make sure it includes: OLLAMA_API_URL=http://ollama:11434/api/generate
#   4. docker compose -f docker-compose.prod.yml up -d
#
# Note: This file is automatically synced to the server on every deploy via CI/CD.

services:
  # ─────────────────────────────────────────────
  # Redis — message broker for Celery
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Django backend
  # ─────────────────────────────────────────────
  backend:
    image: ghcr.io/${GITHUB_USERNAME}/agentsights-backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      BUILD_SHA: ${BUILD_SHA:-unknown}
    ports:
      - "8000:8000"
    volumes:
      # Persist uploaded audio files across deploys
      - media_files:/app/backend/api/media
      # Persist WhisperX / PyAnnote model cache (downloads once, kept forever)
      - hf_cache:/app/.cache/huggingface
      # Local fine-tuned FLAN-T5 model (uploaded once via rsync, never rebuilt)
      - ./model:/app/backend/AI_modules/model
    depends_on:
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Celery worker — processes AI analysis tasks asynchronously
  # concurrency=1: AI tasks are CPU/RAM heavy; one at a time on Hetzner CX42
  # max-tasks-per-child=10: recycle worker to prevent memory leaks from ML models
  # ─────────────────────────────────────────────
  celery_worker:
    image: ghcr.io/${GITHUB_USERNAME}/agentsights-backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - media_files:/app/backend/api/media
      - hf_cache:/app/.cache/huggingface
      - ./model:/app/backend/AI_modules/model
    # max-tasks-per-child=1: each analysis task gets a brand-new worker process.
    # WhisperX + PyAnnote load ~3 GB of models; recycling after every task prevents
    # memory from accumulating across runs and triggering OOM kills.
    command: ["sh", "-c", "cd /app/backend/api && celery -A api worker --loglevel=info --concurrency=1 --max-tasks-per-child=1"]
    healthcheck:
      # Ping the worker over the broker. If the worker is unresponsive (deadlocked,
      # OOM, etc.) Docker will restart the container automatically.
      test: ["CMD-SHELL", "cd /app/backend/api && celery -A api inspect ping --timeout 10 2>&1 | grep -q pong"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s   # Give worker time to load models on first boot
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ─────────────────────────────────────────────
  # Scheduler — runs auto_generate_reports daily at 23:55
  # Uses the same backend image but overrides CMD to run a
  # lightweight shell loop instead of gunicorn.
  # ─────────────────────────────────────────────
  scheduler:
    image: ghcr.io/${GITHUB_USERNAME}/agentsights-backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - media_files:/app/backend/api/media
      - hf_cache:/app/.cache/huggingface
      - ./model:/app/backend/AI_modules/model
    command: ["python", "/app/backend/scheduler_runner.py"]
    depends_on:
      - backend

  # ─────────────────────────────────────────────
  # Celery Beat — fires periodic tasks (e.g. cleanup_stuck_calls every 10 min)
  # Lightweight: no AI models loaded, just schedules tasks into Redis.
  # ─────────────────────────────────────────────
  celery_beat:
    image: ghcr.io/${GITHUB_USERNAME}/agentsights-backend:latest
    restart: unless-stopped
    env_file: .env
    command: ["sh", "-c", "cd /app/backend/api && celery -A api beat --loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  # ─────────────────────────────────────────────
  # Ollama — local LLM for coaching tips
  # Pulls the model on first start; subsequent starts skip download (cached volume)
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.6.2
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Pattern: start serve in background, wait for it to be ready, pull model, then keep alive.
    # Note: avoid $VAR syntax — docker-compose substitutes it before the shell sees it.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama serve & sleep 10 && ollama pull llama3.2; wait"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 15            # Up to 2.5 min for model pull on first boot
      start_period: 20s

volumes:
  media_files:
  hf_cache:
  ollama_data:
  redis_data:
