name: Deploy AgentSights

on:
  push:
    branches: [main]       # Auto-deploy on every push to main
  pull_request:
    branches: [main]       # Lint-only on PRs — no deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agentsights-backend

jobs:
  # ──────────────────────────────────────────────────
  # Job 1: Lint & sanity checks (runs on all events)
  # ──────────────────────────────────────────────────
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend lint
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      # Note: Django system check is skipped in CI because calls/views.py imports
      # the full ML stack (WhisperX, PyTorch, soundfile...) at module level.
      # The Docker build in build-backend validates the full application instead.

  # ──────────────────────────────────────────────────
  # Job 2: Build & push Docker image to GitHub registry
  # Only runs on push to main
  # ──────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write        # Required to push to ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false   # keep language runtimes (node, python…)
          android: true       # ~8 GB
          dotnet: true        # ~2 GB
          haskell: true       # ~5 GB
          large-packages: true
          docker-images: false  # keep cached layers
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Built-in, no extra secret needed

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds to speed up CI
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ──────────────────────────────────────────────────
  # Job 3: Deploy to Hetzner server via SSH
  # Pulls the new image and restarts the container
  # ──────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Hetzner
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # Inline the SHA directly — avoids relying on appleboy/ssh-action envs
            DEPLOY_SHA="${{ github.sha }}"

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            cd /opt/agentsights

            # Pull the updated backend image
            docker compose -f docker-compose.prod.yml pull backend

            # Stamp BUILD_SHA into .env for persistence across restarts
            sed -i '/^BUILD_SHA=/d' .env
            [ -n "$(tail -c1 .env)" ] && echo >> .env
            echo "BUILD_SHA=${DEPLOY_SHA}" >> .env

            # Also export so docker compose picks it up from the shell environment
            # (highest priority for ${BUILD_SHA} substitution in compose file)
            export BUILD_SHA="${DEPLOY_SHA}"

            echo "======================================="
            echo "BUILD_SHA stamped: $(grep '^BUILD_SHA=' .env)"
            echo "======================================="

            # Restart only backend and wait until its healthcheck passes.
            docker compose -f docker-compose.prod.yml up -d --no-deps --wait --force-recreate backend

            # Remove dangling images to save disk space
            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            EXPECTED_SHA="${{ github.sha }}"

            # Debug: check what the container actually has
            cd /opt/agentsights
            echo "=== Container BUILD_SHA ==="
            docker compose -f docker-compose.prod.yml exec -T backend printenv BUILD_SHA || echo "(not set)"
            echo "=== .env file ==="
            grep '^BUILD_SHA=' .env || echo "(not in .env)"
            echo "==========================="

            # Container is already healthy (--wait ensured it above).
            DEPLOYED="unknown"
            for i in $(seq 1 6); do
              RESULT=$(curl -sf http://localhost:8000/api/version/ 2>/dev/null \
                | python3 -c "import sys,json; print(json.load(sys.stdin)['sha'][:7])" 2>/dev/null \
                || echo "")
              if [ -n "$RESULT" ]; then
                DEPLOYED="$RESULT"
                break
              fi
              sleep 5
            done
            EXPECTED="${EXPECTED_SHA:0:7}"
            echo "Expected:  $EXPECTED"
            echo "Deployed:  $DEPLOYED"
            if [ "$DEPLOYED" != "$EXPECTED" ]; then
              echo "ERROR: prod is running the wrong version!"
              exit 1
            fi
            echo "OK: prod is up-to-date."

  # ──────────────────────────────────────────────────
  # Job 4: Deploy frontend to Vercel
  # Runs in parallel with deploy-backend (both depend on lint)
  # ──────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
