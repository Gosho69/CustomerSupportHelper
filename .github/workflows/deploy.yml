name: Deploy AgentSights

on:
  push:
    branches: [main] # Auto-deploy on every push to main
  pull_request:
    branches: [main] # Lint-only on PRs — no deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agentsights-backend

jobs:
  # ──────────────────────────────────────────────────
  # Job 1: Lint & sanity checks (runs on all events)
  # ──────────────────────────────────────────────────
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend lint
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      # Note: Django system check is skipped in CI because calls/views.py imports
      # the full ML stack (WhisperX, PyTorch, soundfile...) at module level.
      # The Docker build in build-backend validates the full application instead.

  # ──────────────────────────────────────────────────
  # Job 2: Build & push Docker image to GitHub registry
  # Only runs on push to main
  # ──────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write # Required to push to ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false # keep language runtimes (node, python…)
          android: true # ~8 GB
          dotnet: true # ~2 GB
          haskell: true # ~5 GB
          large-packages: true
          docker-images: false # keep cached layers
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # Built-in, no extra secret needed

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds to speed up CI
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ──────────────────────────────────────────────────
  # Job 3: Deploy to Hetzner server via SSH
  # Pulls the new image and restarts the container
  # ──────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Hetzner
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      # Sync docker-compose.prod.yml to the server so prod always matches the repo
      - name: Sync compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/agentsights/
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_SSH_HOST }}
          username: ${{ secrets.HETZNER_SSH_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            DEPLOY_SHA="${{ github.sha }}"

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            cd /opt/agentsights

            # Pull the updated backend image
            docker compose -f docker-compose.prod.yml pull backend

            # Stamp BUILD_SHA into .env for persistence across restarts
            sed -i '/^BUILD_SHA=/d' .env
            [ -n "$(tail -c1 .env)" ] && echo >> .env
            echo "BUILD_SHA=${DEPLOY_SHA}" >> .env

            # Export so docker compose picks it up from the shell environment
            export BUILD_SHA="${DEPLOY_SHA}"

            # Ensure redis is running (no-op after first deploy)
            docker compose -f docker-compose.prod.yml up -d redis

            # Recreate backend, scheduler, celery_worker, and celery_beat with the new image.
            # All use the same image; every container must be restarted so it
            # picks up code changes and reruns with the updated pipeline.
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend scheduler celery_worker celery_beat

            # Remove dangling images to save disk space
            docker image prune -f

  # ──────────────────────────────────────────────────
  # Job 4: Deploy frontend to Vercel
  # Runs in parallel with deploy-backend (both depend on lint)
  # ──────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment info
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
