name: Deploy AgentSights

on:
  push:
    branches: [main]       # Auto-deploy on every push to main
  pull_request:
    branches: [main]       # Lint-only on PRs — no deploy

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agentsights-backend

jobs:
  # ──────────────────────────────────────────────────
  # Job 1: Lint & sanity checks (runs on all events)
  # ──────────────────────────────────────────────────
  lint:
    name: Lint & Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Frontend lint
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint

      # Note: Django system check is skipped in CI because calls/views.py imports
      # the full ML stack (WhisperX, PyTorch, soundfile...) at module level.
      # The Docker build in build-backend validates the full application instead.

  # ──────────────────────────────────────────────────
  # Job 2: Build & push Docker image to GitHub registry
  # Targets linux/arm64 for Oracle Cloud Free Tier (Ampere A1)
  # Only runs on push to main
  # ──────────────────────────────────────────────────
  build-backend:
    name: Build & Push Backend Image (ARM64)
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write        # Required to push to ghcr.io
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      # QEMU lets the x86 CI runner emulate ARM64 for cross-compilation
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Buildx is required for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Built-in, no extra secret needed

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between builds to speed up CI
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

  # ──────────────────────────────────────────────────
  # Job 3: Deploy to Oracle Cloud VM via SSH
  # Pulls the new ARM64 image and restarts the container
  # ──────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend → Oracle Cloud
    runs-on: ubuntu-latest
    needs: build-backend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_SSH_HOST }}
          username: ${{ secrets.OCI_SSH_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # Log in to GitHub Container Registry using a long-lived PAT
            # (GITHUB_TOKEN expires after the workflow; GHCR_PAT persists)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

            # Pull the updated backend image
            cd /opt/agentsights
            docker compose -f docker-compose.prod.yml pull backend

            # Restart only backend — Ollama keeps running (no model reload delay)
            docker compose -f docker-compose.prod.yml up -d --no-deps backend

            # Remove dangling images to save disk space
            docker image prune -f

  # ──────────────────────────────────────────────────
  # Job 4: Deploy frontend to Vercel
  # Runs in parallel with deploy-backend (both depend on lint)
  # ──────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment info
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
