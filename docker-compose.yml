# Local development docker-compose — provides Redis (Celery broker) only.
#
# Usage:
#   1. docker compose up -d
#      (starts Redis on localhost:6379)
#
#   2. In a separate terminal — Celery worker (ALWAYS use the venv binary):
#      cd backend/api
#      ../../venv/bin/celery -A api worker --loglevel=info --concurrency=1 --max-tasks-per-child=1
#
#      ⚠️  Queue isolation: if your local .env points to the same Redis as production,
#      set CELERY_TASK_DEFAULT_QUEUE=celery_dev in backend/.env so local tasks do NOT
#      land in the prod queue and block the production worker.
#
#   3. In a separate terminal — Celery Beat scheduler:
#      cd backend/api
#      ../../venv/bin/celery -A api beat --loglevel=info
#      (required for auto-sync of call center recordings every CALL_SYNC_INTERVAL_SECONDS)
#
#   4. In a separate terminal — Django:
#      cd backend/api
#      python manage.py runserver
#
#   5. In a separate terminal — frontend:
#      cd frontend
#      npm run dev
#
# ⚠️  Always use the venv Celery binary (../../venv/bin/celery), NOT the system
#     celery. The system celery won't have whisperx, pyannote, or any ML packages.
#
# The frontend/.env.local already points to http://localhost:8000/api,
# so local dev will use your local Django server, not production.

services:
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
